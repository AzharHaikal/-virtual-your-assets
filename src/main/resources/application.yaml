server:
  port: ${PORT:8000}
  # Behind a reverse proxy (Render, nginx, ...) the real client address comes from X-Forwarded-For.
  # Rate limiting keys on it; without this every client would share the proxy's address.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: VIRTUAL_YOUR_ASSET

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vyra_assets}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      data-source-properties:
        # Bound how long a statement may wait for a row lock (e.g. a wallet being updated by
        # another request) or run at all, instead of hanging until the HTTP client gives up.
        options: "-c lock_timeout=${DB_LOCK_TIMEOUT_MS:5000} -c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:30000}"
  #      data-source-properties:
  #        sslmode: require

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: flyway

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # jdbc.batch_size: 500      # 💡 TAMBAHKAN: Kirim data per 500 baris sekaligus
        # order_inserts: true       # 💡 TAMBAHKAN: Mengoptimalkan batch insert untuk entitas terkait

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%.-12X{traceId},%.-8X{spanId}] %logger{36} : %msg%n"
  level:
    org:
      hibernate:
        SQL: off

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

crypto:
  secret-key: ${CRYPTO_SECRET_KEY}

vyra:
  security:
    pin:
      max-attempts: ${VYRA_PIN_MAX_ATTEMPTS:5}
      lock-minutes: ${VYRA_PIN_LOCK_MINUTES:15}
    otp:
      lock-minutes: ${VYRA_OTP_LOCK_MINUTES:10}
      resend-cooldown-seconds: ${VYRA_OTP_RESEND_COOLDOWN_SECONDS:60}
    admin-login:
      max-attempts: ${VYRA_ADMIN_MAX_ATTEMPTS:5}
      lock-minutes: ${VYRA_ADMIN_LOCK_MINUTES:15}
    rate-limit:
      enabled: ${VYRA_RATE_LIMIT_ENABLED:true}
      # database = counters shared by all instances (default); memory = per instance only
      store: ${VYRA_RATE_LIMIT_STORE:database}
  admin:
    seed:
      name: ${VYRA_ADMIN_SEED_NAME:Super Administrator}
      email: ${VYRA_ADMIN_SEED_EMAIL:superadmin@vyra.local}
      phone-number: ${VYRA_ADMIN_SEED_PHONE:628000000000}
      password: ${VYRA_ADMIN_SEED_PASSWORD:ChangeMe123!}