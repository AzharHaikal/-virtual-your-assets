server:
  port: ${PORT:8000}
  # Behind a reverse proxy (Render, nginx, ...) the real client address comes from X-Forwarded-For.
  # Rate limiting keys on it; without this every client would share the proxy's address.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: VIRTUAL_YOUR_ASSET

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vyra_assets}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      data-source-properties:
        # Bound how long a statement may wait for a row lock (e.g. a wallet being updated by
        # another request) or run at all, instead of hanging until the HTTP client gives up.
        # TimeZone=UTC: timestamptz values are read and written as UTC (see TimeService).
        options: "-c TimeZone=UTC -c lock_timeout=${DB_LOCK_TIMEOUT_MS:5000} -c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:30000}"
  #      data-source-properties:
  #        sslmode: require

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: flyway
    placeholders:
      # V7 (timestamp -> timestamptz): zone of the values written before V7.
      # legacyServerZone = JVM zone of the machine that wrote created_at/updated_at (development laptops: WIB).
      # legacyClientZone = zone the mobile app sent transaction_date in (device local time, WIB).
      legacyServerZone: ${VYRA_LEGACY_SERVER_TIMEZONE:Asia/Jakarta}
      legacyClientZone: ${VYRA_LEGACY_CLIENT_TIMEZONE:Asia/Jakarta}

  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks the entities match it.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        # jdbc.batch_size: 500      # 💡 TAMBAHKAN: Kirim data per 500 baris sekaligus
        # order_inserts: true       # 💡 TAMBAHKAN: Mengoptimalkan batch insert untuk entitas terkait

  jackson:
    time-zone: UTC

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%.-12X{traceId},%.-8X{spanId}] %logger{36} : %msg%n"
  level:
    org:
      hibernate:
        SQL: off

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        # health: public, for the external uptime monitor. prometheus: needs header X-Metrics-Token.
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # Latency p95 per endpoint for the dashboard and the "p95 > 500 ms" alert (docs/monitoring.md).
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99

# OpenAPI spec (/v3/api-docs) and Swagger UI (/swagger-ui.html): off unless enabled (never in production).
springdoc:
  api-docs:
    enabled: ${VYRA_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${VYRA_API_DOCS_ENABLED:false}

crypto:
  secret-key: ${CRYPTO_SECRET_KEY}

vyra:
  # Base URL of this API as seen from outside; used in e-mailed links (data export download).
  public-base-url: ${VYRA_PUBLIC_BASE_URL:http://localhost:8000}
  scheduler:
    # Reminder / push / export jobs. Safe with several instances (ShedLock); off for request-only processes.
    enabled: ${VYRA_SCHEDULER_ENABLED:true}
  metrics:
    # Shared token for /actuator/prometheus (header X-Metrics-Token). Empty = metrics not readable.
    token: ${VYRA_METRICS_TOKEN:}
  push:
    fcm:
      # Firebase service account JSON (the file content or a path to it). Empty = push disabled.
      credentials: ${FIREBASE_CREDENTIALS:}
      project-id: ${FIREBASE_PROJECT_ID:}
  export:
    # How long a data export can be downloaded, and how often a member may request one.
    ttl-hours: ${VYRA_EXPORT_TTL_HOURS:24}
    min-interval-hours: ${VYRA_EXPORT_MIN_INTERVAL_HOURS:24}
  time:
    # Zone for new members without one, for legacy requests without an offset and for
    # day-based admin reports/filters (portal admins are in Indonesia).
    default-zone: ${VYRA_DEFAULT_TIMEZONE:Asia/Jakarta}
  security:
    pin:
      max-attempts: ${VYRA_PIN_MAX_ATTEMPTS:5}
      lock-minutes: ${VYRA_PIN_LOCK_MINUTES:15}
    otp:
      lock-minutes: ${VYRA_OTP_LOCK_MINUTES:10}
      resend-cooldown-seconds: ${VYRA_OTP_RESEND_COOLDOWN_SECONDS:60}
    admin-login:
      max-attempts: ${VYRA_ADMIN_MAX_ATTEMPTS:5}
      lock-minutes: ${VYRA_ADMIN_LOCK_MINUTES:15}
    rate-limit:
      enabled: ${VYRA_RATE_LIMIT_ENABLED:true}
      # database = counters shared by all instances (default); memory = per instance only
      store: ${VYRA_RATE_LIMIT_STORE:database}
  admin:
    seed:
      name: ${VYRA_ADMIN_SEED_NAME:Super Administrator}
      email: ${VYRA_ADMIN_SEED_EMAIL:superadmin@vyra.local}
      phone-number: ${VYRA_ADMIN_SEED_PHONE:628000000000}
      password: ${VYRA_ADMIN_SEED_PASSWORD:ChangeMe123!}