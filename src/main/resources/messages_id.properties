# Indonesian text for API messages, used when the request has Accept-Language: id.
# ErrorConstant carries its own Indonesian text; this file has the rest:
#  - request.* : messages built in GlobalExceptionHandler
#  - Bean Validation messages of the request DTOs, key Constraint.objectName.field
#    (e.g. Size.registerRequest.firstName). A missing key falls back to the DTO's English message.
# Values go through MessageFormat: no apostrophes or curly braces.

