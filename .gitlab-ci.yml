stages:
  - flow-check
  - preparation
  - check-branch
  - unit-test
  - code-build

cache:
  paths:
    - .m2/repository

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

prep-work:
  stage: preparation
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn --version
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

branch-check:
  stage: check-branch
  image: alpine:latest
  script:
    - echo "Running pipeline for branch $CI_COMMIT_REF_NAME"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

run-tests:
  stage: unit-test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn test
  artifacts:
    paths:
      - target/surefire-reports/
    expire_in: 1 hour
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Every *IT against an empty PostgreSQL: SchemaMigrationIT builds the schema from db/migration and starts
# the app with ddl-auto=validate (fails when an entity changes without a matching migration); the others
# check cross-account access, security hardening and concurrency (wallet, OTP attempts, edits) on a real DB.
integration-test:
  stage: unit-test
  image: maven:3.9.6-eclipse-temurin-17
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: vyra_ci
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: jdbc:postgresql://postgres:5432/vyra_ci
    DATABASE_USERNAME: postgres
    DATABASE_PASSWORD: postgres
    MAIL_USERNAME: ci
    MAIL_PASSWORD: ci
    CRYPTO_SECRET_KEY: 0123456789abcdef0123456789abcdef
  script:
    - mvn test -Dtest='*IT' -Dvyra.it.db=true -Dsurefire.failIfNoSpecifiedTests=false
  artifacts:
    paths:
      - target/surefire-reports/
    expire_in: 1 hour
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build-jar:
  stage: code-build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn package -DskipTests=true
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Release flow: feature/* -> dev -> sit -> uat -> prod (-> main as a copy of prod).
# sit/uat/prod are protected (no direct push); this job fails a merge request whose source is not
# the previous environment, and "Pipelines must succeed" then blocks the merge.
merge-flow-check:
  stage: flow-check
  image: alpine:latest
  script:
    - |
      case "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" in
        sit)  expected=dev ;;
        uat)  expected=sit ;;
        prod) expected=uat ;;
        main) expected=prod ;;
        *)    echo "Target $CI_MERGE_REQUEST_TARGET_BRANCH_NAME: any source allowed."; exit 0 ;;
      esac
      if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "$expected" ]; then
        echo "Merge into '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME' must come from '$expected', not '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'."
        echo "Flow: feature/* -> dev -> sit -> uat -> prod"
        exit 1
      fi
      echo "OK: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME -> $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
